<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Us — Tipsy Tech Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A100C;
    --surface:#111A14;
    --surface-2:#16211A;
    --line:#233026;
    --line-bright:#3B5240;
    --green:#8CFF4E;
    --green-dim:#5FA83B;
    --green-deep:#2C3F26;
    --text:#EFF5EE;
    --text-muted:#8FA391;
    --text-faint:#5C6B5F;
    --red-dot:#FF5F57;
    --yellow-dot:#FEBC2E;
    --green-dot:#28C840;
    --radius:14px;
    --display:'Space Grotesk', sans-serif;
    --body:'Manrope', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(140,255,78,0.05), transparent 40%),
      radial-gradient(circle at 85% 60%, rgba(140,255,78,0.04), transparent 45%);
  }

  a{color:inherit;text-decoration:none;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  ::selection{background:var(--green);color:#0A100C;}

  :focus-visible{outline:2px solid var(--green);outline-offset:3px;}

  /* ---------- circuit backdrop ---------- */
  .circuit-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;
  }

  /* ---------- nav ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,16,12,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex;align-items:center;justify-content:space-between;
    height:76px;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-family:var(--display);font-weight:700;font-size:1.15rem;
    letter-spacing:0.01em;
  }
  .logo-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(155deg, var(--green) 0%, var(--green-dim) 100%);
    display:flex;align-items:center;justify-content:center;
    color:#0A100C;font-family:var(--mono);font-weight:700;font-size:0.95rem;
    flex-shrink:0;
  }
  .logo span.dim{color:var(--text-muted);font-weight:500;}
  .nav-links{display:flex;gap:36px;font-size:0.92rem;color:var(--text-muted);}
  .nav-links a{transition:color 0.2s;}
  .nav-links a:hover{color:var(--green);}
  .nav-cta{
    font-family:var(--mono);font-size:0.82rem;
    border:1px solid var(--line-bright);
    padding:9px 18px;border-radius:8px;
    color:var(--text);transition:all 0.2s;
    white-space:nowrap;
  }
  .nav-cta:hover{border-color:var(--green);color:var(--green);background:rgba(140,255,78,0.06);}
  .nav-toggle{display:none;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;z-index:1;
    padding:88px 0 60px;
  }
  .hero-grid{
    display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:0.78rem;color:var(--green);
    border:1px solid var(--line-bright);border-radius:999px;
    padding:6px 14px;margin-bottom:26px;
    background:rgba(140,255,78,0.05);
  }
  .eyebrow .pulse{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(140,255,78,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(140,255,78,0.5);}
    70%{box-shadow:0 0 0 7px rgba(140,255,78,0);}
    100%{box-shadow:0 0 0 0 rgba(140,255,78,0);}
  }
  h1{
    font-family:var(--display);
    font-size:clamp(2.4rem, 4.4vw, 3.55rem);
    font-weight:700;
    line-height:1.06;
    letter-spacing:-0.01em;
    margin-bottom:22px;
  }
  h1 .accent{color:var(--green);}
  .hero p.lede{
    font-size:1.08rem;color:var(--text-muted);max-width:480px;margin-bottom:34px;
  }
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px;}
  .btn-primary{
    font-family:var(--mono);font-weight:600;font-size:0.9rem;
    background:var(--green);color:#0A100C;
    padding:14px 26px;border-radius:9px;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform 0.15s, box-shadow 0.2s;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(140,255,78,0.22);}
  .btn-ghost{
    font-family:var(--mono);font-weight:500;font-size:0.9rem;
    border:1px solid var(--line-bright);color:var(--text);
    padding:14px 26px;border-radius:9px;
    transition:all 0.2s;
  }
  .btn-ghost:hover{border-color:var(--green);color:var(--green);}
  .trust-row{display:flex;gap:26px;flex-wrap:wrap;color:var(--text-faint);font-size:0.82rem;font-family:var(--mono);}
  .trust-row strong{color:var(--text-muted);font-weight:600;}

  /* ---------- browser build mock ---------- */
  .browser-mock{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  .browser-chrome{
    display:flex;align-items:center;gap:8px;
    padding:12px 14px;border-bottom:1px solid var(--line);
    background:var(--surface-2);
  }
  .browser-dot{width:10px;height:10px;border-radius:50%;}
  .browser-dot.r{background:var(--red-dot);}
  .browser-dot.y{background:var(--yellow-dot);}
  .browser-dot.g{background:var(--green-dot);}
  .browser-url{
    flex:1;margin-left:8px;
    background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:5px 12px;
    font-family:var(--mono);font-size:0.76rem;color:var(--text-muted);
    display:flex;align-items:center;
  }
  .browser-url .typed::after{
    content:'';display:inline-block;width:6px;height:13px;background:var(--green);
    margin-left:2px;vertical-align:middle;animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .browser-body{padding:20px;}
  .mock-nav{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line);
    opacity:0;animation:fadeUp 0.6s ease forwards;animation-delay:0.9s;
  }
  .mock-logo{width:70px;height:10px;border-radius:3px;background:var(--green-deep);}
  .mock-links{display:flex;gap:10px;}
  .mock-links span{width:32px;height:7px;border-radius:3px;background:var(--line-bright);}
  .mock-hero{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;
    opacity:0;animation:fadeUp 0.6s ease forwards;animation-delay:1.15s;
  }
  .mock-lines span{display:block;height:11px;border-radius:3px;background:var(--line-bright);margin-bottom:10px;}
  .mock-lines span:nth-child(1){width:90%;}
  .mock-lines span:nth-child(2){width:70%;}
  .mock-btn{width:86px;height:26px;border-radius:6px;background:var(--green);margin-top:14px;}
  .mock-art{
    height:96px;border-radius:8px;
    background:linear-gradient(135deg, var(--green-deep), var(--surface-2));
    border:1px solid var(--line-bright);
    position:relative;overflow:hidden;
  }
  .mock-art::after{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, transparent 0 12px, rgba(140,255,78,0.08) 12px 13px);
  }
  .mock-cards{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px;
    opacity:0;animation:fadeUp 0.6s ease forwards;animation-delay:1.4s;
  }
  .mock-card{
    border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);
  }
  .mock-card span{display:block;height:7px;border-radius:3px;background:var(--line-bright);}
  .mock-card span.w1{width:60%;margin-bottom:7px;}
  .mock-card span.w2{width:85%;background:var(--green-deep);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .status-line{
    font-family:var(--mono);font-size:0.72rem;color:var(--green-dim);
    padding:10px 20px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;
  }

  @media (prefers-reduced-motion: reduce){
    .mock-nav,.mock-hero,.mock-cards{animation:none;opacity:1;}
    .pulse,.browser-url .typed::after{animation:none;}
  }

  /* ---------- section shared ---------- */
  section{position:relative;z-index:1;}
  .section-pad{padding:88px 0;}
  .section-head{max-width:600px;margin:0 auto 52px;text-align:center;}
  .section-head .eyebrow{margin-bottom:16px;}
  .section-head h2{
    font-family:var(--display);font-size:clamp(1.7rem,3vw,2.4rem);
    font-weight:700;letter-spacing:-0.01em;margin-bottom:14px;
  }
  .section-head p{color:var(--text-muted);font-size:1rem;}
  .divider{height:1px;background:var(--line);}

  /* ---------- feature strip ---------- */
  .feature-strip{
    display:grid;grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  }
  .feature-item{
    padding:26px 22px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;
    background:var(--surface);transition:background 0.2s;
  }
  .feature-item:last-child{border-right:none;}
  .feature-item:hover{background:var(--surface-2);}
  .feature-icon{color:var(--green);font-family:var(--mono);font-size:1.1rem;}
  .feature-item h3{font-family:var(--display);font-size:1rem;font-weight:600;}
  .feature-item p{font-size:0.85rem;color:var(--text-muted);}

  /* ---------- why us ---------- */
  .why-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;
  }
  .why-list{list-style:none;}
  .why-list li{
    display:flex;gap:14px;align-items:flex-start;
    padding:16px 0;border-bottom:1px solid var(--line);
  }
  .why-list li:first-child{padding-top:0;}
  .why-list .num{font-family:var(--mono);color:var(--green-dim);font-size:0.8rem;padding-top:2px;}
  .why-list h4{font-family:var(--display);font-size:1rem;font-weight:600;margin-bottom:4px;}
  .why-list p{font-size:0.85rem;color:var(--text-muted);}
  .why-panel{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);padding:30px;
    font-family:var(--mono);font-size:0.84rem;color:var(--text-muted);
  }
  .why-panel .line{padding:6px 0;display:flex;gap:10px;}
  .why-panel .line .sym{color:var(--green);}
  .why-panel .out{color:var(--text);}

  /* ---------- responsive ---------- */
  @media (max-width:960px){
    .hero-grid{grid-template-columns:1fr;}
    .feature-strip{grid-template-columns:repeat(2,1fr);}
    .feature-item:nth-child(2){border-right:none;}
    .feature-item{border-bottom:1px solid var(--line);}
    .why-grid{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr;gap:32px;}
    .nav-links{display:none;}
  }
  @media (max-width:600px){
    .wrap{padding:0 20px;}
    .feature-strip{grid-template-columns:1fr;}
    .feature-item{border-right:none;}
    .cta-band{padding:40px 24px;}
  }
  /* Hero overlay */
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 30% 30%, rgba(0,0,0,0.25), transparent 70%);
    pointer-events:none;
    z-index:0;
  }
  .hero > .wrap{position:relative;z-index:1;}
  /* Body tweaks */
  .wrap{max-width:1100px;}
  @media (min-width:960px){
    body{line-height:1.6;}
  }
  /* Feature icons */
  .feature-icon{
    font-size:1.4rem;
    width:2.4rem;height:2.4rem;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(140,255,78,0.1);
  }
  /* btn-ghost hover glow */
  .btn-ghost:hover{
    border-color:var(--green);
    color:var(--green);
    box-shadow:inset 0 0 0 2px var(--green);
  }
  /* button active scale */
  .btn-primary:active,
  .btn-ghost:active{
    transform:scale(0.97);
  }
  /* link underline animation */
  .nav-links a,
  .footer-col a{
    position:relative;
  }
  .nav-links a::after,
  .footer-col a::after{
    content:"";
    position:absolute;
    left:0;bottom:-2px;
    height:2px;width:0;
    background:var(--green);
    transition:width .25s ease;
  }
  .nav-links a:hover::after,
  .footer-col a:hover::after{width:100%;}

/* ---------- footer ---------- */
  footer{
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:80px 0 40px;
  }
  .footer-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:50px;
    margin-bottom:40px;
  }
  .footer-brand p{
    color:var(--text-muted);
    font-size:0.92rem;
    line-height:1.6;
    margin-top:16px;
    max-width:280px;
  }
  .footer-col h5{
    font-family:var(--mono);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--text-faint);
    margin-bottom:20px;
    position:relative;
    padding-left:8px;
  }
  .footer-col h5::before{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:4px;
    height:18px;
    background:var(--green);
    border-radius:2px;
  }
  .footer-col a, .footer-col p{
    display:block;
    font-size:0.9rem;
    color:var(--text-muted);
    padding:4px 0;
    transition:all 0.2s;
    position:relative;
  }
  .footer-col a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-2px;
    width:0;
    height:2px;
    background:var(--green);
    transition:width .25s ease;
  }
  .footer-col a:hover{
    color:var(--green);
  }
  .footer-col a:hover::after{
    width:100%;
  }
  .footer-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:30px;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--text-faint);
    flex-wrap:wrap;
    gap:16px;
  }
  /* feature-item hover lift */
  .feature-item:hover{
    background:var(--surface-2);
    transform:translateY(-4px);
  }
  /* text-muted lighten */
  :root{
    --text-muted:#9FB8A5;
  }

  /* ---------- preloader ---------- */
  .preloader{
    position:fixed;inset:0;z-index:9999;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .preloader-inner{
    width:320px;max-width:90vw;
  }
  .preloader-content{
    text-align:center;
  }
  .preloader-text{
    display:flex;flex-direction:column;gap:12px;
    align-items:center;margin-bottom:24px;
    font-family:var(--mono);font-size:1.1rem;
    color:var(--green);
  }
  .preloader-line{
    font-family:var(--mono);font-weight:600;
    min-width:8ch;text-align:center;
    position:relative;display:inline-block;
  }
  .preloader-line.active{
    position:relative;
  }
  .preloader-line.active::after{
    content:'';position:absolute;left:0;bottom:-4px;
    width:100%;height:2px;background:var(--green);
    transform:scaleX(0);transform-origin:left;
    animation:typeCursor 1.2s infinite;
  }
  @keyframes typeCursor{
    to{transform:scaleX(1);}
  }
  .preloader-line.done{
    color:var(--text-muted);
  }
  .preloader-progress{
    width:100%;height:8px;background:var(--surface-2);
    border-radius:4px;overflow:hidden;
    margin-top:8px;
  }
  .preloader-fill{
    height:100%;background:var(--green);
    width:0%;transition:width 0.3s ease;
  }
  .preloader-pct{
    display:block;margin-top:8px;font-family:var(--mono);
    font-size:0.9rem;color:var(--text-muted);
  }
  .preloader.done{
    opacity:0;pointer-events:none;
  }
  body.is-loading{overflow:hidden;}
</head>

<main>

  <section class="section-pad" id="why">
    <div class="wrap why-grid">
      <div>
        <div class="eyebrow">WHY CHOOSE US</div>

      </div>
      <div class="why-panel">

        <div class="line out">tipsy_tech_solutions — Goa, India</div>
        <div class="line"><span class="sym">$</span> cat mission.txt</div>

<script>
    (function(){
      var pre = document.getElementById('preloader');
      if(!pre){ return; }
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var lines = Array.prototype.slice.call(pre.querySelectorAll('.preloader-line'));
      var fill = pre.querySelector('.preloader-fill');
      var pct = pre.querySelector('.preloader-pct');

      function setProgress(v){
        fill.style.width = v + '%';
        pct.textContent = Math.round(v) + '%';
      }

      function tween(from, to, duration){
        return new Promise(function(resolve){
          var t0 = performance.now();
          function frame(now){
            var p = Math.min(1, (now - t0) / duration);
            setProgress(from + (to - from) * p);
            if(p < 1){ requestAnimationFrame(frame); } else { resolve(); }
          }
          requestAnimationFrame(frame);
        });
      }

      function typeLine(el){
        return new Promise(function(resolve){
          var text = el.getAttribute('data-text') || '';
          el.classList.add('active');
          var i = 0;
          (function step(){
            el.textContent = text.slice(0, i);
            if(i <= text.length){
              i++;
              setTimeout(step, 12 + Math.random() * 16);
            } else {
              el.classList.remove('active');
              el.classList.add('done');
              resolve();
            }
          })();
        });
      }

      async function typeAll(){
        for(var i = 0; i < lines.length; i++){
          await typeLine(lines[i]);
        }
      }

      var pageReady = new Promise(function(resolve){
        if(document.readyState === 'complete'){ resolve(); }
        else { window.addEventListener('load', resolve, { once:true }); }
      });

      function finish(){
        pre.classList.add('done');
        document.body.classList.remove('is-loading');
        setTimeout(function(){
          if(pre.parentNode){ pre.parentNode.removeChild(pre); }
        }, 650);
      }

      if(reduceMotion){
        lines.forEach(function(el){
          el.textContent = el.getAttribute('data-text');
          el.classList.add('done');
        });
        setProgress(100);
        pageReady.then(finish);
        return;
      }

      var animation = (async function(){
        typeAll();
        await tween(0, 42, 500);
        await tween(42, 78, 650);
        await tween(78, 100, 450);
      })();

      Promise.all([animation, pageReady]).then(function(){
        setTimeout(finish, 200);
      });
    })();
    </script>
